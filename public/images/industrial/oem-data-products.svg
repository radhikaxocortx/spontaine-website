<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
  <title id="t">Governed data shared with a customer</title>
  <desc id="d">Three translucent panes hold a company's data. One mint thread carries a chosen slice across to a frosted customer portal card; the other threads stop short.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8f3ec"/>
      <stop offset="0.45" stop-color="#eef0ec"/>
      <stop offset="0.75" stop-color="#e3eee8"/>
      <stop offset="1" stop-color="#d6e9f6"/>
    </linearGradient>
    <radialGradient id="glowAmber" cx="0.3" cy="0.25" r="0.45">
      <stop offset="0" stop-color="#ffe2aa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe2aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMint" cx="0.62" cy="0.62" r="0.4">
      <stop offset="0" stop-color="#0fe5a8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0fe5a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paneA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#cfe6f6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="paneB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e3eee8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="paneC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f1e8d6" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0fe5a8" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#0fe5a8"/>
      <stop offset="1" stop-color="#0a9271"/>
    </linearGradient>
    <linearGradient id="fadeThread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9999a1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9999a1" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#15232d" flood-opacity="0.12"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Wash and ambient light -->
  <rect width="1200" height="900" fill="url(#wash)"/>
  <rect width="1200" height="900" fill="url(#glowAmber)"/>
  <rect width="1200" height="900" fill="url(#glowMint)"/>

  <!-- Your data: three translucent panes -->
  <g filter="url(#soft)">
    <g transform="translate(150 210) skewY(-8)">
      <rect width="210" height="430" rx="14" fill="url(#paneC)" stroke="#ffffff" stroke-opacity="0.9"/>
      <rect width="210" height="430" rx="14" fill="url(#grid)" opacity="0.6"/>
    </g>
    <g transform="translate(210 240) skewY(-8)">
      <rect width="210" height="430" rx="14" fill="url(#paneB)" stroke="#ffffff" stroke-opacity="0.9"/>
      <rect width="210" height="430" rx="14" fill="url(#grid)" opacity="0.6"/>
      <rect x="0" y="0" width="3" height="430" fill="#0fe5a8" opacity="0.55"/>
    </g>
    <g transform="translate(270 270) skewY(-8)">
      <rect width="210" height="430" rx="14" fill="url(#paneA)" stroke="#ffffff" stroke-opacity="0.95"/>
      <rect width="210" height="430" rx="14" fill="url(#grid)" opacity="0.6"/>
      <rect x="0" y="0" width="3" height="430" fill="#4962ff" opacity="0.35"/>
    </g>
  </g>

  <!-- Threads: only the chosen slice reaches the customer -->
  <path d="M470 330 C 560 330, 600 300, 660 300" fill="none" stroke="url(#fadeThread)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <path d="M470 560 C 560 560, 600 610, 650 620" fill="none" stroke="url(#fadeThread)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <path d="M470 445 C 580 445, 640 420, 760 420" fill="none" stroke="url(#thread)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="470" cy="445" r="6" fill="#ffffff" stroke="#0fe5a8" stroke-width="2"/>
  <circle cx="610" cy="430" r="4" fill="#0fe5a8"/>
  <circle cx="760" cy="420" r="7" fill="#0fe5a8"/>
  <circle cx="760" cy="420" r="16" fill="#0fe5a8" opacity="0.16"/>

  <!-- Customer portal card -->
  <g filter="url(#soft)">
    <rect x="740" y="250" width="340" height="400" rx="24" fill="#ffffff" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.95"/>
  </g>
  <!-- header -->
  <circle cx="782" cy="294" r="12" fill="#ecfaf5" stroke="#0fe5a8" stroke-opacity="0.6"/>
  <rect x="806" y="286" width="120" height="8" rx="4" fill="#2e2e2e" opacity="0.7"/>
  <rect x="806" y="300" width="74" height="6" rx="3" fill="#2e2e2e" opacity="0.25"/>
  <rect x="1000" y="284" width="58" height="22" rx="11" fill="#ecfaf5"/>
  <rect x="1012" y="292" width="34" height="6" rx="3" fill="#0a9271" opacity="0.7"/>
  <line x1="764" y1="330" x2="1056" y2="330" stroke="#2e2e2e" stroke-opacity="0.08"/>

  <!-- rows: orders, certificates, quality, delivery -->
  <g>
    <circle cx="782" cy="372" r="9" fill="#d4eeff"/>
    <rect x="802" y="366" width="150" height="7" rx="3.5" fill="#2e2e2e" opacity="0.55"/>
    <rect x="802" y="380" width="96" height="5" rx="2.5" fill="#2e2e2e" opacity="0.2"/>
    <rect x="988" y="366" width="68" height="14" rx="7" fill="#ecfaf5"/>

    <line x1="764" y1="408" x2="1056" y2="408" stroke="#2e2e2e" stroke-opacity="0.06"/>
    <circle cx="782" cy="440" r="9" fill="#ecfaf5" stroke="#0fe5a8" stroke-opacity="0.5"/>
    <rect x="802" y="434" width="120" height="7" rx="3.5" fill="#2e2e2e" opacity="0.55"/>
    <rect x="802" y="448" width="140" height="5" rx="2.5" fill="#2e2e2e" opacity="0.2"/>
    <path d="M1030 438 l8 8 l14 -16" fill="none" stroke="#0a9271" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="764" y1="476" x2="1056" y2="476" stroke="#2e2e2e" stroke-opacity="0.06"/>
    <circle cx="782" cy="508" r="9" fill="#fff9e7" stroke="#c97b12" stroke-opacity="0.35"/>
    <rect x="802" y="502" width="138" height="7" rx="3.5" fill="#2e2e2e" opacity="0.55"/>
    <rect x="802" y="516" width="80" height="5" rx="2.5" fill="#2e2e2e" opacity="0.2"/>
    <!-- small quality trend -->
    <polyline points="976,522 992,514 1006,518 1020,506 1034,509 1050,498" fill="none" stroke="#0fe5a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="764" y1="544" x2="1056" y2="544" stroke="#2e2e2e" stroke-opacity="0.06"/>
    <circle cx="782" cy="576" r="9" fill="#d4eeff"/>
    <rect x="802" y="570" width="110" height="7" rx="3.5" fill="#2e2e2e" opacity="0.55"/>
    <rect x="802" y="584" width="130" height="5" rx="2.5" fill="#2e2e2e" opacity="0.2"/>
    <!-- on-time bar -->
    <rect x="976" y="572" width="80" height="8" rx="4" fill="#2e2e2e" opacity="0.08"/>
    <rect x="976" y="572" width="66" height="8" rx="4" fill="#0fe5a8"/>
  </g>

  <!-- scope boundary around the card -->
  <rect x="724" y="234" width="372" height="432" rx="32" fill="none" stroke="#0fe5a8" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 8"/>
</svg>
